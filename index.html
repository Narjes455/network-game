 task:'شبكة 192.168.1.0 فيها سيرفر عنوانه 192.168.1.2 يوزّع العناوين بـ DHCP. أضف 4 أجهزة تاخذ عناوينها تلقائياً وتوصل للسيرفر.',
 hint:'السيرفر: IP 192.168.1.2 ← تبويب الخدمات: فعّل DHCP، Start IP = 192.168.1.10 واحفظ. بعدها افتح كل جهاز واختر «تلقائي (DHCP)».',
 reqs:[
  ['سيرفر 192.168.1.2 يشغّل DHCP',()=>{const s=serverAt('192.168.1.2');return !s?no('ما فيه سيرفر بالعنوان 192.168.1.2.'):s.svc.dhcp.on?OK:no('خدمة DHCP مطفأة في السيرفر.')}],
  ['4 أجهزة على الأقل',()=>need(clients(),4,'أجهزة')],
  ['كل الأجهزة تاخذ عناوينها من DHCP',()=>leasedAll(clients())],
  ['كل الأجهزة في الشبكة 192.168.1.0',()=>allIn(clients(),'192.168.1.0')],
  ['كل الأجهزة توصل للسيرفر',()=>{const s=serverAt('192.168.1.2');return s?reach(clients(),[s]):no('السيرفر غير موجود.')}]]},

{id:'m9',title:'DHCP من الراوتر',tag:'ip dhcp pool',cli:true,
 lesson:`<p>الراوتر نفسه يقدر يكون سيرفر DHCP — بدون سيرفر إضافي!</p>
 <ul><li><b dir="ltr">ip dhcp pool</b> ينشئ مجموعة عناوين.</li><li><b dir="ltr">excluded-address</b> يحجز عناوين ما تنعطى (للراوتر والسيرفرات والطابعات).</li>
 <li><b dir="ltr">show ip dhcp binding</b> يوريك مين أخذ أي عنوان.</li></ul>`+pre(`R1(config)# ip dhcp excluded-address 192.168.1.1 192.168.1.10
R1(config)# ip dhcp pool LAN
R1(dhcp-config)# network 192.168.1.0 255.255.255.0
R1(dhcp-config)# default-router 192.168.1.1
R1(dhcp-config)# dns-server 8.8.8.8
R1(dhcp-config)# end
R1# show ip dhcp binding`),
 task:'راوتر منفذه 192.168.1.1 موصول بسويتش عليه 3 أجهزة على الأقل. خلّ الراوتر يوزّع العناوين بـ DHCP، مع حجز العناوين من 192.168.1.1 إلى 192.168.1.10.',
 hint:'أول: interface g0/0 ← ip address 192.168.1.1 255.255.255.0 ← no shutdown. بعدها أوامر الـ DHCP في الدرس. آخر شي خلّ الأجهزة على «تلقائي (DHCP)».',
 reqs:[
  ['راوتر عنده DHCP Pool',()=>T('router').some(r=>r.pools.some(p=>p.net))?OK:no('ما فيه DHCP Pool فيه network.')],
  ['العناوين 192.168.1.1 - 192.168.1.10 محجوزة',()=>T('router').some(r=>covers(r,'192.168.1.1','192.168.1.10'))?OK:no('استخدم ip dhcp excluded-address 192.168.1.1 192.168.1.10')],
  ['3 أجهزة على الأقل',()=>need(clients(),3,'أجهزة')],
  ['كل الأجهزة تاخذ عناوينها من الراوتر',()=>leasedBy(clients(),'router')],
  ['كل الأجهزة توصل للبوابة 192.168.1.1',()=>reachIp(clients(),'192.168.1.1')]]},

{id:'m10',title:'موقع المدرسة',tag:'DNS وHTTP',
 lesson:`<p>نحفظ أسماء المواقع مو أرقامها. <b>DNS</b> يحوّل الاسم إلى IP مثل جهات الاتصال 📒.</p>
 <ul><li>سيرفر DNS فيه سجلات: <span dir="ltr">www.site.com → 192.168.1.100</span></li>
 <li>كل جهاز لازم يعرف عنوان سيرفر الـ DNS.</li><li>خدمة <b>HTTP</b> تعرض صفحة الموقع في المتصفح.</li></ul>`,
 task:'المدرسة تبغى موقع داخلي اسمه www.school.com. ابنِ شبكة فيها سيرفر يشغّل الموقع، و3 أجهزة على الأقل تفتح الموقع بالاسم من المتصفح.',
 hint:'السيرفر 192.168.1.100: فعّل HTTP و DNS وأضف سجل www.school.com = 192.168.1.100. في كل جهاز DNS Server = 192.168.1.100. جرّب من تبويب «المتصفح».',
 reqs:[
  ['سيرفر يشغّل موقع (HTTP)',()=>T('server').some(s=>s.svc.http.on)?OK:no('ما فيه سيرفر خدمة HTTP فيه شغالة.')],
  ['سجل DNS للاسم www.school.com',()=>dnsHas('www.school.com')?OK:no('ما فيه سيرفر DNS شغال فيه سجل www.school.com.')],
  ['3 أجهزة على الأقل',()=>need(clients(),3,'أجهزة')],
  ['كل الأجهزة تفتح www.school.com',()=>webAll(clients(),'www.school.com')]]},

{id:'m11',title:'شبكة ذكية',tag:'DHCP + DNS',
 lesson:`<p>في الشبكات الحقيقية الموظف ما يكتب ولا إعداد: DHCP يعطيه <b>كل شي</b> — العنوان والبوابة وعنوان الـ DNS.</p>
 <ul><li>في إعدادات DHCP بالسيرفر خانة <b>DNS Server</b>، هذا اللي ينعطى للأجهزة.</li><li>نفس السيرفر يقدر يشغّل DHCP و DNS و HTTP مع بعض.</li></ul>`,
 task:'ابنِ شبكة فيها 4 أجهزة على الأقل، كلها تاخذ إعداداتها تلقائياً من DHCP (بدون DNS يدوي)، وكلها تفتح الموقع www.company.com',
 hint:'سيرفر 192.168.1.100: DHCP (Start 192.168.1.10، DNS = 192.168.1.100) + DNS (www.company.com = 192.168.1.100) + HTTP. احفظ الخدمات قبل ما تخلي الأجهزة DHCP.',
 reqs:[
  ['4 أجهزة على الأقل',()=>need(clients(),4,'أجهزة')],
  ['كل الأجهزة على DHCP',()=>leasedAll(clients())],
  ['سجل DNS للاسم www.company.com',()=>dnsHas('www.company.com')?OK:no('ما فيه سيرفر DNS شغال فيه سجل www.company.com.')],
  ['كل الأجهزة تفتح www.company.com',()=>webAll(clients(),'www.company.com')]]},

{id:'m12',title:'تقسيم بالـ VLAN',tag:'VLAN',cli:true,
 lesson:`<p><b>VLAN</b> تقسّم السويتش الواحد لعدة شبكات منفصلة — كأنها سويتشات مختلفة!</p>
 <ul><li>أجهزة VLAN 10 ما تشوف أجهزة VLAN 20 حتى لو على نفس السويتش ونفس الشبكة.</li>
 <li>كل منفذ <b>Access</b> ينتمي لـ VLAN وحدة. افتراضياً كل المنافذ في VLAN 1.</li>
 <li>رقم المنفذ مكتوب على الكيبل عند السويتش (<span dir="ltr">Fa0/1</span>…).</li></ul>`+pre(`Switch> enable
Switch# configure terminal
Switch(config)# vlan 10
Switch(config-vlan)# name SALES
Switch(config-vlan)# vlan 20
Switch(config-vlan)# name HR
Switch(config-vlan)# exit
Switch(config)# interface fa0/1
Switch(config-if)# switchport mode access
Switch(config-if)# switchport access vlan 10
Switch(config-if)# end
Switch# show vlan brief`),
 task:'سويتش واحد عليه 4 أجهزة كلها في الشبكة 192.168.1.0. قسّمهم: جهازين في VLAN 10 اسمها SALES، وجهازين في VLAN 20 اسمها HR. أجهزة نفس الـ VLAN تتواصل، والـ VLANs معزولة عن بعض.',
 hint:'شوف أرقام المنافذ على الكيبلات عند السويتش. مثلاً Fa0/1 و Fa0/2 → vlan 10، و Fa0/3 و Fa0/4 → vlan 20. تأكد بـ show vlan brief.',
 reqs:[
  ['VLAN 10 اسمها SALES',()=>vlanNamed(10,'SALES')],
  ['VLAN 20 اسمها HR',()=>vlanNamed(20,'HR')],
  ['جهازين في VLAN 10',()=>need(inVlan(10),2,'أجهزة في VLAN 10')],
  ['جهازين في VLAN 20',()=>need(inVlan(20),2,'أجهزة في VLAN 20')],
  ['كل الأجهزة في الشبكة 192.168.1.0',()=>allIn(clients(),'192.168.1.0')],
  ['أجهزة نفس الـ VLAN تتواصل',()=>{const a=reach(inVlan(10),inVlan(10));return a.ok?reach(inVlan(20),inVlan(20)):a}],
  ['VLAN 10 معزولة عن VLAN 20',()=>isolated(inVlan(10),inVlan(20))]]},

{id:'m13',title:'ربط الـ VLANs',tag:'Router-on-a-Stick',cli:true,
 lesson:`<p>الـ VLANs معزولة، فكيف تتواصل؟ بالراوتر! وبكيبل واحد بس:</p>
 <ul><li>منفذ السويتش اللي للراوتر يصير <b>Trunk</b> — يحمل كل الـ VLANs.</li>
 <li>في الراوتر نسوي <b>Subinterfaces</b>: <span dir="ltr">g0/0.10</span> لـ VLAN 10 و <span dir="ltr">g0/0.20</span> لـ VLAN 20.</li>
 <li><b dir="ltr">encapsulation dot1Q</b> يربط الـ Subinterface برقم الـ VLAN — لازم قبل الـ IP.</li></ul>`+pre(`Switch(config)# interface fa0/8
Switch(config-if)# switchport mode trunk

Router(config)# interface g0/0
Router(config-if)# no shutdown
Router(config-if)# interface g0/0.10
Router(config-subif)# encapsulation dot1Q 10
Router(config-subif)# ip address 192.168.10.1 255.255.255.0
Router(config-subif)# interface g0/0.20
Router(config-subif)# encapsulation dot1Q 20
Router(config-subif)# ip address 192.168.20.1 255.255.255.0`),
 task:'سويتش عليه VLAN 10 (شبكة 192.168.10.0) و VLAN 20 (شبكة 192.168.20.0)، جهازين في كل VLAN. اربط السويتش بالراوتر بكيبل واحد (Trunk) وخلّ كل الأجهزة تتواصل.',
 hint:'السويتش: vlan 10 و vlan 20، منافذ الأجهزة access، والمنفذ اللي للراوتر trunk. الراوتر: no shutdown على g0/0 ثم subinterfaces. الأجهزة: VLAN 10 بوابتها 192.168.10.1 و VLAN 20 بوابتها 192.168.20.1.',
 reqs:[
  ['جهازين في VLAN 10 بشبكة 192.168.10.0',()=>need(inVlan(10,'192.168.10.0'),2,'أجهزة')],
  ['جهازين في VLAN 20 بشبكة 192.168.20.0',()=>need(inVlan(20,'192.168.20.0'),2,'أجهزة')],
  ['منفذ Trunk بين السويتش والراوتر',()=>trunkToRouter()?OK:no('منفذ السويتش الموصول بالراوتر لازم يكون switchport mode trunk.')],
  ['Subinterfaces لـ VLAN 10 و 20 في الراوتر',()=>T('router').some(R=>[10,20].every(v=>R.ports.some(p=>p.subs.some(s=>s.vlan===v&&s.ip))))?OK:no('سوّ g0/0.10 و g0/0.20 مع encapsulation dot1Q و ip address.')],
  ['كل الأجهزة تتواصل',()=>reach(clients(),clients())]]},

{id:'m14',title:'فرعين',tag:'Static Routing',cli:true,
 lesson:`<p>الراوتر يعرف بس الشبكات <b>الموصولة فيه مباشرة</b>. لو عندك راوترين، كل واحد ما يعرف شبكة الثاني!</p>
 <ul><li>تعلّمه بـ <b dir="ltr">ip route</b>: الشبكة البعيدة + Mask + <b>Next Hop</b> (عنوان الراوتر الثاني).</li>
 <li>الراوترين يتصلون بشبكة صغيرة خاصة، مثل <span dir="ltr">10.0.0.0/30</span> (فيها عنوانين بس).</li>
 <li>لازم Route في <b>الاتجاهين</b> عشان الرد يرجع. تأكد بـ <b dir="ltr">show ip route</b>.</li></ul>`+pre(`R1(config)# interface g0/1
R1(config-if)# ip address 10.0.0.1 255.255.255.252
R1(config-if)# no shutdown
R1(config)# ip route 192.168.2.0 255.255.255.0 10.0.0.2

R2(config)# ip route 192.168.1.0 255.255.255.0 10.0.0.1`),
 task:'فرع جدة 192.168.1.0 وفرع الرياض 192.168.2.0. كل فرع له راوتر، والراوترين موصولين ببعض مباشرة. جهّز الراوترين بالأوامر بحيث أجهزة الفرعين تتواصل (جهازين في كل فرع).',
 hint:'R1: g0/0 = 192.168.1.1، g0/1 = 10.0.0.1/30، ip route 192.168.2.0 255.255.255.0 10.0.0.2. R2: g0/0 = 10.0.0.2/30، g0/1 = 192.168.2.1، ip route 192.168.1.0 255.255.255.0 10.0.0.1 (انتبه لأسماء المنافذ على الكيبلات).',
 reqs:[
  ['راوترين',()=>need(T('router'),2,'راوترات')],
  ['الراوترين موصولين ببعض مباشرة',()=>S.links.some(l=>dev(l.a).type==='router'&&dev(l.b).type==='router')?OK:no('وصّل الراوترين بكيبل مباشر.')],
  ['جهازين في فرع جدة 192.168.1.0',()=>need(netOf('192.168.1.0'),2,'أجهزة')],
  ['جهازين في فرع الرياض 192.168.2.0',()=>need(netOf('192.168.2.0'),2,'أجهزة')],
  ['الفرعين يتواصلون',()=>reach(netOf('192.168.1.0'),netOf('192.168.2.0'))]]},

{id:'m15',title:'سيرفر DHCP مركزي',tag:'DHCP Relay',cli:true,
 lesson:`<p>طلب DHCP <b>broadcast</b> — ما يعدّي الراوتر. طيب لو سيرفر DHCP في شبكة ثانية؟</p>
 <ul><li><b dir="ltr">ip helper-address</b> على منفذ الراوتر يخلّيه يمرّر طلبات DHCP للسيرفر (Relay).</li>
 <li>بداية عناوين الـ DHCP في السيرفر لازم تكون من شبكة الموظفين، والـ Gateway = منفذ الراوتر.</li>
 <li>السيرفر نفسه يحتاج Gateway عشان يرد.</li></ul>`+pre(`R1(config)# interface g0/0
R1(config-if)# ip address 192.168.1.1 255.255.255.0
R1(config-if)# ip helper-address 192.168.100.10
R1(config-if)# no shutdown`),
 task:'شبكة الموظفين 192.168.1.0 فيها 3 أجهزة على الأقل. سيرفر DHCP في شبكة السيرفرات 192.168.100.0. خلّ الموظفين ياخذون عناوينهم من هذا السيرفر عبر الراوتر.',
 hint:'السيرفر: 192.168.100.10، بوابته 192.168.100.1، DHCP: Start 192.168.1.10، Gateway 192.168.1.1. الراوتر: g0/0 = 192.168.1.1 + ip helper-address 192.168.100.10، g0/1 = 192.168.100.1.',
 reqs:[
  ['سيرفر DHCP في 192.168.100.0',()=>T('server').some(s=>inNet(s,'192.168.100.0')&&s.svc.dhcp.on)?OK:no('ما فيه سيرفر في 192.168.100.0 يشغّل DHCP.')],
  ['الراوتر فيه ip helper-address',()=>T('router').some(R=>R.ports.some(p=>p.helper||p.subs.some(s=>s.helper)))?OK:no('أضف ip helper-address على منفذ الموظفين.')],
  ['3 أجهزة في 192.168.1.0',()=>need(netOf('192.168.1.0'),3,'أجهزة')],
  ['الأجهزة تاخذ عناوينها من السيرفر',()=>leasedBy(clients(),'server')],
  ['كل الأجهزة توصل للسيرفر',()=>{const s=T('server').filter(s=>inNet(s,'192.168.100.0'));return s.length?reach(clients(),s):no('السيرفر غير موجود.')}]]},

{id:'m16',title:'التحدي النهائي',tag:'🏆 شبكة مؤسسة',cli:true,
 lesson:`<p>🏆 المهمة الأخيرة تجمع كل شي: VLANs + Router-on-a-Stick + DHCP من الراوتر + Static Routing + DNS/HTTP + أمان وحفظ.</p>
 <ul><li>فكّر بالتصميم قبل البناء: مين يتصل بمين؟ وأي شبكة بين الراوترين؟</li>
 <li><b dir="ltr">ip route 0.0.0.0 0.0.0.0 &lt;next-hop&gt;</b> = Default Route (أي شي ما يعرفه يروح هنا).</li>
 <li>لا تنسى <b dir="ltr">enable secret</b> على كل جهاز شبكة و <b dir="ltr">write memory</b> في الآخر.</li></ul>`,
 task:'مبنى الموظفين فيه سويتش عليه VLAN 10 (192.168.10.0) و VLAN 20 (192.168.20.0)، جهازين في كل VLAN ياخذون عناوينهم من DHCP. غرفة السيرفرات 192.168.100.0 فيها سيرفر يشغّل www.corp.com، خلف راوتر ثاني. كل الأجهزة تفتح الموقع، والـ VLANs تتواصل، وكل الراوترات والسويتشات عليها enable secret وإعداداتها محفوظة.',
 hint:'SW1: VLAN 10/20 + trunk للراوتر R1. R1: g0/0.10 و g0/0.20 + pools (LAN10: default-router 192.168.10.1، dns-server 192.168.100.10 / LAN20 مثلها) + g0/1 = 10.0.0.1/30 + ip route 0.0.0.0 0.0.0.0 10.0.0.2. R2: g0/0 = 10.0.0.2/30، g0/1 = 192.168.100.1 + ip route 192.168.10.0 و 192.168.20.0 عبر 10.0.0.1. السيرفر 192.168.100.10 بوابته .1 يشغّل DNS + HTTP.',
 reqs:[
  ['جهازين في VLAN 10 (192.168.10.0)',()=>need(inVlan(10,'192.168.10.0'),2,'أجهزة')],
  ['جهازين في VLAN 20 (192.168.20.0)',()=>need(inVlan(20,'192.168.20.0'),2,'أجهزة')],
  ['كل الأجهزة تاخذ عناوينها من DHCP',()=>leasedAll(clients())],
  ['راوترين على الأقل',()=>need(T('router'),2,'راوترات')],
  ['سيرفر في 192.168.100.0 يشغّل الموقع',()=>T('server').some(s=>inNet(s,'192.168.100.0')&&s.svc.http.on)?OK:no('ما فيه سيرفر في 192.168.100.0 يشغّل HTTP.')],
  ['VLAN 10 و VLAN 20 يتواصلون',()=>reach(inVlan(10),inVlan(20))],
  ['كل الأجهزة تفتح www.corp.com',()=>webAll(clients(),'www.corp.com')],
  ['enable secret على كل راوتر وسويتش',()=>allSecret()],
  ['كل الإعدادات محفوظة (write memory)',()=>allSaved()]]},
];
const LAB={id:'lab',title:'المختبر الحر',tag:'🧪 جرّب أي شبكة',lesson:'',task:'',hint:'',reqs:[]};

/* ================= LAB ASSESSMENT HELPERS ================= */
const N=n=>S.devices.find(d=>d.name===n);
const Dv=(n,f)=>{const d=N(n);return d?f(d):no(`ما فيه جهاز اسمه ${n} (انتبه للأحرف الكبيرة والشرطة).`)};
function pidx(d,p){
  if(HOST.includes(d.type))return 0;const i=parseIf(p);if(!i)return -1;
  if(d.type==='router')return i.kind==='gi'&&i.slot===0&&i.port<4&&i.sub==null?i.port:-1;
  if(i.kind==='fa'&&i.slot===0&&i.port>=1&&i.port<=24)return i.port-1;
  if(i.kind==='gi'&&i.slot===0&&i.port>=1&&i.port<=2)return 23+i.port;
  return -1;
}
const isDev=(n,t)=>Dv(n,d=>d.type===t?OK:no(`${n} لازم يكون ${META[t].label}، حالياً ${META[d.type].label}.`));
function conn(a,pa,b,pb){
  const A=N(a),B=N(b);if(!A||!B)return no(`لازم يكون فيه جهاز اسمه ${A?b:a}.`);
  const l=linkBetween(A.id,B.id);if(!l)return no(`${a} مو موصول بـ ${b}.`);
  for(const [D,p] of [[A,pa],[B,pb]]){const want=pidx(D,p),got=portOf(l,D.id);if(!HOST.includes(D.type)&&want!==got)return no(`الكيبل في ${D.name} لازم يكون على ${p} — حالياً على ${short(portName(D,got))}.`)}
  if(!cableOk(l))return no(`نوع الكيبل غلط (${cableName(l.type)}) — لازم ${cableName(needType(A,B))}.`);
  return OK;
}
const hostCfg=(n,ip,mask,gw)=>Dv(n,d=>d.ip!==ip?no(`IP لازم يكون ${ip} (حالياً ${d.ip||'فاضي'}).`):d.mask!==mask?no(`Subnet Mask لازم ${mask}.`):gw!=null&&d.gw!==gw?no(`Default Gateway لازم ${gw} (حالياً ${d.gw||'فاضي'}).`):OK);

/* ================= TOPOLOGY & DOC ================= */
function topoSvg(t){
  const W=440,H=330,P=(x,y)=>[34+x/100*(W-68),28+y/100*(H-74)],pos={};
  t.n.forEach(([n,ty,x,y])=>pos[n]={ty,p:P(x,y)});
  let s='';
  t.l.forEach(([a,pa,b,pb,c])=>{const A=pos[a].p,B=pos[b].p;
    s+=`<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" class="tl${c==='c'?' tc':''}"/>`;
    for(const [P1,P2,lab,ty] of [[A,B,pa,pos[a].ty],[B,A,pb,pos[b].ty]]){if(!lab)continue;
      const dx=P2[0]-P1[0],dy=P2[1]-P1[1],L=Math.hypot(dx,dy)||1,k=Math.min(ty==='switch'?52:46,L/2.4),x=P1[0]+dx/L*k,y=P1[1]+dy/L*k;
      s+=`<rect x="${x-22}" y="${y-10}" width="44" height="16" rx="4" class="tlb"/><text x="${x}" y="${y+2.5}" class="tpt">${esc(lab)}</text>`}});
  t.n.forEach(([n,ty,x,y])=>{const [X,Y]=pos[n].p;
    s+=ty==='router'?`<circle cx="${X}" cy="${Y}" r="20" class="trt"/><text x="${X}" y="${Y+6}" class="tic" fill="#fff">✛</text>`:
       ty==='switch'?`<rect x="${X-27}" y="${Y-13}" width="54" height="26" rx="6" class="tsw"/><text x="${X}" y="${Y+5}" class="tic" fill="#fff" style="font-size:13px">⇄ ⇄</text>`:
       `<rect x="${X-20}" y="${Y-19}" width="40" height="38" rx="9" class="thost"/><text x="${X}" y="${Y+7}" class="tic">${META[ty].icon}</text>`;
    s+=`<text x="${X}" y="${Y+(ty==='switch'?28:35)}" class="tnm">${esc(n)}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" class="topo" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
}
const cellQ=v=>v==='?'?'<td class="q">؟</td>':`<td>${v?esc(v):'—'}</td>`;
function labDoc(L){
  const idx=LABS.indexOf(L)+1;
  return `<span class="tag">لاب ${idx} · ${esc(L.level)} · ${esc(L.tag)}</span><h3>🧪 ${esc(L.title)}</h3>${L.intro}
    <h4 class="dh">🗺️ شكل الشبكة (Topology)</h4>${topoSvg(L.topo)}
    <p class="note" style="font-size:12.5px">الخط المتصل = Straight-Through · الخط المنقّط = Crossover</p>
    ${L.table?`<h4 class="dh">📋 جدول العناوين</h4><div style="overflow-x:auto"><table class="atbl"><tr><th>الجهاز</th><th>المنفذ</th><th>IP</th><th>Mask</th><th>Gateway</th></tr>${L.table.map(r=>`<tr><td><b>${esc(r[0])}</b></td>${r.slice(1).map(cellQ).join('')}</tr>`).join('')}</table></div>${L.table.some(r=>r.includes('?'))?'<p class="note" style="font-size:13px">الخانات اللي عليها <b>؟</b> لازم تحددها أنت.</p>':''}`:''}
    <h4 class="dh">🛠️ المطلوب</h4>${L.steps}
    <p class="lockn" style="margin-top:10px">لما تخلص اضغط <b>✔ تحقق</b> عشان تشوف نسبة الإنجاز (Completion) وأي بند ناقص.</p>`;
}

{id:'p6',title:'تقسيم الشبكة (Subnetting)',level:'متوسط',tag:'Subnet /25',
 intro:`<p>عندك شبكة وحدة <span dir="ltr">192.168.100.0/24</span> ولازم تقسمها إلى <b>شبكتين متساويتين</b>: LAN-A و LAN-B.</p>
 <ul><li>نستلف بت واحد: <span dir="ltr">/24 → /25</span>، يعني Mask = <span dir="ltr">255.255.255.128</span>.</li>
 <li>حجم كل شبكة = 256 ÷ 2 = <b>128</b> عنوان: الأولى من 0 إلى 127، والثانية من 128 إلى 255.</li>
 <li>أول عنوان = عنوان الشبكة، آخر عنوان = Broadcast — ما ينعطون لأجهزة.</li>
 <li><b>القاعدة:</b> الراوتر ياخذ <b>أول</b> عنوان صالح في كل شبكة، والكمبيوتر ياخذ <b>آخر</b> عنوان صالح.</li></ul>`,
 topo:{n:[['R1','router',50,10],['S1','switch',22,48],['S2','switch',78,48],['PC-A','pc',22,88],['PC-B','pc',78,88]],l:[['R1','G0/0','S1','G0/1'],['R1','G0/1','S2','G0/1'],['S1','F0/1','PC-A','Fa0'],['S2','F0/1','PC-B','Fa0']]},
 table:[['R1','G0/0 (LAN-A)','?','?',''],['R1','G0/1 (LAN-B)','?','?',''],['PC-A','NIC','?','?','?'],['PC-B','NIC','?','?','?']],
 steps:`<ol><li>احسب الشبكتين: LAN-A = ؟ و LAN-B = ؟ (كل وحدة /25).</li><li>ابنِ الشبكة حسب الشكل.</li><li>اضبط منافذ R1 بأول عنوان صالح في كل شبكة (وشغّلها).</li><li>اضبط PC-A و PC-B بآخر عنوان صالح + البوابة.</li><li>تأكد إن PC-A يوصل لـ PC-B.</li></ol>`,
 hint:`LAN-A: 192.168.100.0/25 → R1 G0/0 = 192.168.100.1، PC-A = 192.168.100.126 بوابته .1. LAN-B: 192.168.100.128/25 → R1 G0/1 = 192.168.100.129، PC-B = 192.168.100.254 بوابته .129. الـ Mask للكل 255.255.255.128.`,

  ['الأجهزة','R1',()=>isDev('R1','router')],['الأجهزة','S1',()=>isDev('S1','switch')],['الأجهزة','S2',()=>isDev('S2','switch')],['الأجهزة','PC-A',()=>isDev('PC-A','pc')],['الأجهزة','PC-B',()=>isDev('PC-B','pc')],

  ['R1','G0/0 أول عنوان في LAN-A',()=>ifCfg('R1','G0/0','192.168.100.1','255.255.255.128')],['R1','G0/1 أول عنوان في LAN-B',()=>ifCfg('R1','G0/1','192.168.100.129','255.255.255.128')],
  ['R1','المنفذين up',()=>{const a=ifUp('R1','G0/0');return a.ok?ifUp('R1','G0/1'):a}],

{id:'p7',title:'الوصول الآمن بـ SSH',level:'متوسط',tag:'SSH',
 intro:`<p><b>Telnet</b> يرسل كل شي (حتى كلمة السر) كنص واضح 😱. البديل الآمن: <b>SSH</b> — كل الاتصال مشفّر.</p>
 <ul><li>SSH يحتاج: اسم جهاز (hostname) + اسم نطاق (domain-name) + مفاتيح RSA + مستخدم (username).</li>
 <li><b dir="ltr">login local</b> = الدخول باسم المستخدم وكلمة سره.</li><li><b dir="ltr">transport input ssh</b> = نمنع Telnet ونسمح بـ SSH فقط.</li></ul>`,
 topo:{n:[['R1','router',50,12],['S1','switch',50,48],['PC-A','pc',50,86]],l:[['R1','G0/0','S1','G0/1'],['S1','F0/1','PC-A','Fa0']]},
 table:[['R1','G0/0','192.168.1.1',R24,''],['PC-A','NIC','192.168.1.10',R24,'192.168.1.1']],
 steps:`<ol><li>ابنِ الشبكة واضبط عنوان R1 G0/0 و PC-A.</li><li>اضبط SSH على R1:</li></ol>`+P_(`R1(config)# enable secret ${E55}
R1(config)# service password-encryption
R1(config)# ip domain-name ccna-lab.com
R1(config)# username admin secret Adm1nPa55
R1(config)# crypto key generate rsa
How many bits in the modulus [512]: 1024
R1(config)# ip ssh version 2
R1(config)# line vty 0 4
R1(config-line)# transport input ssh
R1(config-line)# login local
R1(config-line)# end
R1# copy running-config startup-config`)+`<ol start="3"><li>من PC-A: <span dir="ltr">ssh -l admin 192.168.1.1</span> وادخل بكلمة السر <b>Adm1nPa55</b>.</li><li>جرّب <span dir="ltr">telnet 192.168.1.1</span> — المفروض يُرفض ✋.</li></ol>`,

{id:'p8',title:'DHCP على الراوتر',level:'متوسط',tag:'DHCPv4',

 <li>داخل الـ Pool: <b dir="ltr">network</b> و <b dir="ltr">default-router</b> و <b dir="ltr">dns-server</b>.</li><li>تأكد بـ <b dir="ltr">show ip dhcp binding</b>.</li></ul>`,

 table:[['R1','G0/0','192.168.10.1',R24,''],['PC1','NIC','DHCP','DHCP','DHCP'],['PC2','NIC','DHCP','DHCP','DHCP'],['PC3','NIC','DHCP','DHCP','DHCP']],

/* ---------------- 10 ---------------- */
{id:'p10',title:'إعداد VLANs',level:'متوسط',tag:'VLAN',
 intro:`<p>المدرسة تبغى تفصل أجهزة <b>المعلمين</b> عن <b>الطلاب</b> على نفس السويتش، وتخصص VLAN لإدارة السويتش.</p>
 <ul><li>VLAN 10 = <b>Faculty</b> · VLAN 20 = <b>Students</b> · VLAN 99 = <b>Management</b> (الأسماء حساسة للأحرف).</li>
 <li>منافذ الأجهزة <b>access</b>، وكل منفذ في VLAN وحدة.</li><li>عنوان إدارة السويتش يكون على <b dir="ltr">interface vlan 99</b>.</li></ul>`,

{id:'p11',title:'Trunk بين سويتشين',level:'متقدم',tag:'802.1Q Trunk',
 intro:`<p>الـ VLANs موزعة على <b>سويتشين</b>. كيف يوصل PC1 (VLAN 10 على S1) لـ PC3 (VLAN 10 على S2)؟ بكيبل <b>Trunk</b> يحمل كل الـ VLANs.</p>
 <ul><li><b dir="ltr">switchport mode trunk</b> على المنفذين G0/1 في الطرفين.</li><li>الـ VLAN لازم تكون موجودة في <b>السويتشين</b>.</li>
 <li>سويتش ↔ سويتش = كيبل <b>Crossover</b>.</li></ul>`,

 table:[['PC1 (VLAN 10)','NIC','172.17.10.21',R24,''],['PC2 (VLAN 20)','NIC','172.17.20.22',R24,''],['PC3 (VLAN 10)','NIC','172.17.10.23',R24,''],['PC4 (VLAN 20)','NIC','172.17.20.24',R24,'']],
 steps:`<ol><li>في <b>السويتشين</b>: vlan 10 name Faculty، vlan 20 name Students.</li><li>F0/11 → access vlan 10، F0/18 → access vlan 20.</li><li>وصّل S1 G0/1 ↔ S2 G0/1 بـ Crossover، واضبط الطرفين:</li></ol>`+P_(`S1(config)# interface g0/1
S1(config-if)# switchport mode trunk
S1# show interfaces trunk`)+`<ol start="4"><li>جرّب ping من PC1 إلى PC3، ومن PC2 إلى PC4.</li></ol>`,

  ['S2','VLAN 10 و 20',()=>{const a=vlanNm('S2',10,'Faculty');return a.ok?vlanNm('S2',20,'Students'):a}],['S2','F0/11 و F0/18 access',()=>{const a=accessP('S2','F0/11',10);return a.ok?accessP('S2','F0/18',20):a}],['S2','G0/1 trunk',()=>trunkP('S2','G0/1')],
  ['الكمبيوترات','PC1',()=>hostCfg('PC1','172.17.10.21',R24)],['الكمبيوترات','PC2',()=>hostCfg('PC2','172.17.20.22',R24)],['الكمبيوترات','PC3',()=>hostCfg('PC3','172.17.10.23',R24)],['الكمبيوترات','PC4',()=>hostCfg('PC4','172.17.20.24',R24)],
  ['الاتصال','PC1 ↔ PC3 عبر الـ Trunk',()=>pingN('PC1','172.17.10.23')],['الاتصال','PC2 ↔ PC4 عبر الـ Trunk',()=>pingN('PC2','172.17.20.24')]]},

{id:'p12',title:'التوجيه بين الـ VLANs',level:'متقدم',tag:'Router-on-a-Stick',
 intro:`<p>الـ VLANs معزولة، وعشان تتواصل نحتاج <b>راوتر</b>. بدل كيبل لكل VLAN، نستخدم <b>كيبل واحد Trunk</b> و <b>Subinterfaces</b>.</p>
 <ul><li>منفذ السويتش للراوتر: <b dir="ltr">switchport mode trunk</b>.</li><li>في الراوتر: <span dir="ltr">G0/0.10</span> لـ VLAN 10 و <span dir="ltr">G0/0.20</span> لـ VLAN 20.</li>
 <li><b dir="ltr">encapsulation dot1Q</b> لازم <b>قبل</b> ip address. والمنفذ الأساسي G0/0 لازم no shutdown.</li></ul>`,

 table:[['R1','G0/0.10','192.168.10.1',R24,''],['R1','G0/0.20','192.168.20.1',R24,''],['PC1 (VLAN 10)','NIC','192.168.10.10',R24,'?'],['PC2 (VLAN 20)','NIC','192.168.20.10',R24,'?']],

R1(config-if)# no shutdown

R1(config-subif)# ip address 192.168.20.1 255.255.255.0
R1(config-subif)# end
R1# show ip interface brief`)+`<ol start="3"><li>اضبط الكمبيوترات (البوابة = subinterface الـ VLAN حقتها)، وجرّب PC1 → PC2.</li></ol>`,

  ['R1','G0/0 up',()=>ifUp('R1','G0/0')],['R1','G0/0.10',()=>subCfg('R1','G0/0.10',10,'192.168.10.1',R24)],['R1','G0/0.20',()=>subCfg('R1','G0/0.20',20,'192.168.20.1',R24)],['R1','محفوظ',()=>savedN('R1')],
  ['الكمبيوترات','PC1 + بوابة',()=>hostCfg('PC1','192.168.10.10',R24,'192.168.10.1')],['الكمبيوترات','PC2 + بوابة',()=>hostCfg('PC2','192.168.20.10',R24,'192.168.20.1')],

{id:'p13',title:'التوجيه الثابت والافتراضي',level:'متقدم',tag:'Static & Default Routes',

{id:'p14',title:'سيرفر DHCP مركزي',level:'متقدم',tag:'DHCP Relay',
 intro:`<p>سيرفر DHCP في غرفة السيرفرات (شبكة ثانية). المشكلة: طلب DHCP <b>Broadcast</b> وما يعدّي الراوتر.</p>

/* ================= CHECK ================= */
const isLab=()=>!!(L&&L.items);
const listOf=()=>isLab()?LABS:LEVELS;
const lvIndex=()=>listOf().indexOf(L);
function safe(c){try{const r=c();return typeof r==='boolean'?(r?OK:no('غير مكتمل.')):r}catch(e){return no('الشبكة ناقصة، كمّلها وجرّب مرة ثانية.')}}
function evaluate(){
  if(isLab())return L.items.map(([g,t,c])=>{const r=safe(c);return{g,t,ok:r.ok,why:r.why}});
  return L.reqs.map(([t,c])=>{const r=safe(c);return{t,ok:r.ok,why:r.why}});
}
function renderMission(){
  const el=$('#mission');
  if(isLab()){
    const pct=S.pct||0;
    el.innerHTML=`<div class="gh"><span>🧪 ${esc(L.tag)}</span><button class="mini" id="mDoc">📘 التعليمات والعناوين</button></div>
      <div class="prog"><i style="width:${pct}%"></i></div><small class="note">${S.checks?`آخر فحص: <b>${pct}%</b> مكتمل`:'ابنِ الشبكة حسب التعليمات، وإذا خلصت اضغط ✔ تحقق'}</small>`;
    $('#mDoc').onclick=showLesson;return;
  }
  if(!L.reqs.length){el.innerHTML='<div class="gh"><span>🧪 وضع حر: ابنِ أي شبكة وجرّبها</span></div>';return}
  const last=S.last||[];
  el.innerHTML=`<div class="gh" id="mToggle"><span>📋 المهمة${S.checks?` · آخر تحقق: ${last.filter(x=>x).length}/${L.reqs.length}`:''}</span>${missionOpen?'▴':'▾'}</div>`+
    (missionOpen?`<p>${esc(L.task)}</p><ul>${L.reqs.map(([t],i)=>{const s=last[i];return `<li class="${s===true?'ok':s===false?'no':''}">${s===true?'✅':s===false?'❌':'⬜'} ${esc(t)}</li>`}).join('')}</ul>`:'');
  $('#mToggle').onclick=()=>{missionOpen=!missionOpen;renderMission()};
}
function runCheck(){
  if(busy)return toast('انتظر حتى تخلص الرسالة الحالية','',1300);
  const res=evaluate(),okN=res.filter(r=>r.ok).length,pct=Math.round(okN/res.length*100),pass=okN===res.length;
  S.checks=(S.checks||0)+1;S.last=res.map(r=>r.ok);S.pct=pct;
  P.pct=P.pct||{};P.pct[L.id]=Math.max(P.pct[L.id]||0,pct);
  let stars=0;
  if(pass){stars=Math.max(1,3-(S.hint?1:0)-(S.checks>(isLab()?3:2)?1:0));P.stars[L.id]=Math.max(P.stars[L.id]||0,stars);S.won=true}
  save();renderMission();
  if(isLab())return showResults(res,pct,pass,stars);
  if(pass)return showWin(stars,res);
  modal(`<h3>❌ ما تعدّيت المرحلة بعد</h3><p style="color:var(--muted);margin:2px 0">حققت ${okN} من ${res.length} — صلّح اللي باللون الأحمر وتحقق مرة ثانية.</p>
    <ul class="res">${res.map(r=>`<li class="${r.ok?'ok':'no'}">${r.ok?'✅':'❌'} ${esc(r.t)}${r.ok?'':`<small>${esc(r.why||'')}</small>`}</li>`).join('')}</ul>
    <div class="mbtns"><button class="pri" id="mOk">رجوع للتعديل 🔧</button></div>`);
  $('#mOk').onclick=closeModal;
}
function showResults(res,pct,win,stars){
  const groups=[...new Set(res.map(r=>r.g))],i=lvIndex(),last=i===LABS.length-1;
  modal(`<h3>${win?(last?'🏆 مبروك! أنهيت كل اللابات':'🎉 أحسنت! أنهيت اللاب'):'📊 Activity Results'}</h3>
    ${win?`<div class="big">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><p style="text-align:center;color:var(--muted);margin:0">${stars===3?'أداء مثالي!':(S.hint?'استخدمت الحل (−⭐) ':'')+(S.checks>3?'· فحصت أكثر من 3 مرات (−⭐)':'')}</p>`:''}
    <div class="pct">Completion: <b>${pct}%</b></div><div class="prog big"><i style="width:${pct}%"></i></div>
    <p class="note" style="margin:6px 0 8px;font-size:13px">Assessment Items — ${res.filter(r=>r.ok).length} من ${res.length} بند</p>
    ${groups.map(g=>{const it=res.filter(r=>r.g===g),ok=it.filter(r=>r.ok).length;
      return `<details class="grp" ${ok<it.length?'open':''}><summary>${ok===it.length?'✅':'⚠️'} ${esc(g)} <span>${ok}/${it.length}</span></summary><ul class="res">${it.map(r=>`<li class="${r.ok?'ok':'no'}">${r.ok?'✅':'❌'} ${esc(r.t)}${r.ok?'':`<small>${esc(r.why||'')}</small>`}</li>`).join('')}</ul></details>`}).join('')}
    <div class="mbtns">${win?`${last?'':'<button class="pri" id="mNext">اللاب التالي ←</button>'}<button id="mOk">أكمل هنا</button><button id="mHome">القائمة</button>`:'<button class="pri" id="mOk">رجوع للتعديل 🔧</button>'}</div>`);
  $('#mOk').onclick=closeModal;
  if($('#mNext'))$('#mNext').onclick=()=>{closeModal();openLevel(LABS[i+1],false)};
  if($('#mHome'))$('#mHome').onclick=()=>{closeModal();goHome()};
}

/* ================= UI ================= */
function toast(msg,k='',ms=2600){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast '+k;t.innerHTML=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
function modal(html){$('#mbox').innerHTML=html;$('#modal').hidden=false;$('#mbox').scrollTop=0}
function closeModal(){$('#modal').hidden=true}
function setMode(m){mode=m;pending=null;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));$('#statusTxt').innerHTML=HINTS[m];render()}
function buildToolbar(){
  $('#toolbar').innerHTML=ALL.map(k=>`<button class="tb" data-add="${k}"><span class="i">${META[k].icon}</span>${META[k].label}</button>`).join('')+'<span class="sep"></span>'+
    [['move','✋','تحريك'],['cable','🔌','كيبل'],['ping','✉️','Ping'],['delete','❌','حذف']].map(([m,i,l])=>`<button class="tb" data-mode="${m}"><span class="i">${i}</span>${l}</button>`).join('');
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addDevice(b.dataset.add));
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
}
function showLesson(){
  if(isLab()){modal(labDoc(L)+`<div class="mbtns"><button class="pri" id="mGo">ابدأ البناء 🚀</button></div>`);$('#mGo').onclick=closeModal;return}
  if(!L.lesson)return;
  modal(`<span class="tag">المرحلة ${lvIndex()+1} · ${esc(L.tag)}</span><h3>📘 ${esc(L.title)}</h3>${L.lesson}
    ${L.cli?'<p class="lockn">⌨️ هذي المرحلة <b>بالأوامر</b>: الراوتر والسويتش يتجهّزون من تبويب <b>CLI</b> فقط (الكمبيوترات والسيرفرات عادي).</p>':''}<div class="task">🎯 المهمة: ${esc(L.task)}<ol class="reqs">${L.reqs.map(([t])=>`<li>${esc(t)}</li>`).join('')}</ol></div>
    <p style="color:var(--muted);font-size:13.5px">ابنِ الشبكة كاملة، وإذا خلصت اضغط <b>✔ تحقق</b> تحت.</p>
    <div class="mbtns"><button class="pri" id="mGo">ابدأ البناء 🚀</button></div>`);
  $('#mGo').onclick=closeModal;
}
function showWin(stars,res){
  const i=lvIndex(),last=i===LEVELS.length-1;
  modal(`<h3 style="text-align:center">${last?'🏆 مبروك! ختمت التدريبات':'🎉 تعدّيت المرحلة!'}</h3><div class="big">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
   <p style="text-align:center;color:var(--muted);margin:0">${stars===3?'أداء مثالي!':(S.hint?'استخدمت التلميح (−⭐) ':'')+(S.checks>2?'· تحققت أكثر من مرتين (−⭐)':'')}</p>
   <ul class="res">${res.map(r=>`<li class="ok">✅ ${esc(r.t)}</li>`).join('')}</ul>
   <div class="mbtns">${last?'':'<button class="pri" id="mNext">المرحلة التالية ←</button>'}<button id="mStay">أكمل هنا</button><button id="mHome">القائمة</button></div>`);
  if($('#mNext'))$('#mNext').onclick=()=>{closeModal();openLevel(LEVELS[i+1],false)};
  $('#mStay').onclick=closeModal;
  $('#mHome').onclick=()=>{closeModal();goHome()};
}
function buildSetup(lv){
  const r=svg.getBoundingClientRect(),W=Math.max(r.width,320),H=Math.max(r.height,340);
  const B={
    dev(n,type,x,y,p={}){const d=newDev(type,uid(),n);Object.assign(d,p);d.x=Math.round(40+x/100*(W-80));d.y=Math.round(36+y/100*(H-100));S.devices.push(d);return d},
    link(a,pa,b,pb,type){const A=N(a),B2=N(b);connect(A.id,B2.id,true,{pa:pidx(A,pa),pb:pidx(B2,pb),type:type||'auto'})},
    cli(n,lines){const d=N(n),ss={st:newSt(),out:()=>{},remote:false};lines.forEach(l=>cliExec(d,l,ss))}
  };
  lv.setup(B);
  Object.keys(termHist).forEach(k=>delete termHist[k]);
}
function openLevel(lv,fresh){
  L=lv;$('#home').hidden=true;$('#game').hidden=false;$('#sheet').hidden=true;openId=null;
  [termHist,webState,cliSt,pcSess].forEach(o=>Object.keys(o).forEach(k=>delete o[k]));
  const n=lvIndex()+1;
  $('#gTitle').innerHTML=L.id==='lab'?'🧪 '+esc(L.title):esc((isLab()?'لاب ':'')+n+'. '+L.title)+(L.cli?'<span class="cli-tag">⌨️ CLI</span>':'');
  $('#gLesson').hidden=$('#gHint').hidden=$('#checkBtn').hidden=!L.lesson&&!L.items;
  buildToolbar();
  const saved=!fresh&&P.cur&&P.cur.lvl===L.id;
  S=saved?P.cur.S:{devices:[],links:[],hint:false,checks:0,last:null,won:false,ev:{},pct:0};
  if(!saved&&L.setup)buildSetup(L);
  missionOpen=true;setMode('move');renderMission();save();
  if(!saved)showLesson();
}
function goHome(){
  L=null;$('#game').hidden=true;$('#sheet').hidden=true;$('#home').hidden=false;openId=null;
  const tr=P.track||'labs',list=tr==='labs'?LABS:LEVELS;P.pct=P.pct||{};
  $('#htabs').innerHTML=`<button data-t="labs" class="${tr==='labs'?'on':''}">🧪 لابات Packet Tracer</button><button data-t="levels" class="${tr==='levels'?'on':''}">🎓 تدريبات سريعة</button>`;
  document.querySelectorAll('#htabs button').forEach(b=>b.onclick=()=>{P.track=b.dataset.t;storeP();goHome()});
  $('#hsub').textContent=tr==='labs'?'لابات بنفس أسلوب Cisco Packet Tracer: تعليمات وجدول عناوين، تبني من الصفر، وتشوف نسبة الإنجاز (Completion)':'مراحل قصيرة: كل مرحلة مهمة تبنيها من الصفر وتضغط «تحقق»';
  const tot=list.reduce((a,l)=>a+(P.stars[l.id]||0),0);
  $('#total').textContent=`⭐ ${tot} / ${list.length*3}`;
  $('#grid').innerHTML=list.map((l,i)=>{const st=P.stars[l.id]||0,lock=i>0&&!P.stars[list[i-1].id],pc=P.pct[l.id]||0;
    return `<button class="card ${lock?'locked':''} ${st?'done':''}" data-i="${i}"><span class="n">${lock?'🔒':i+1}</span>${l.cli?'<span class="cli-tag">⌨️ CLI</span>':''}${l.level?`<span class="lvl lv-${l.level}">${esc(l.level)}</span>`:''}
      <b>${esc(l.title)}</b><small>${esc(l.tag)}</small>${tr==='labs'&&pc&&!st?`<span class="cpct">${pc}%</span>`:''}<span class="st">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</span></button>`}).join('')+
    `<button class="card lab" data-i="lab"><span class="n">🧪</span><b>${LAB.title}</b><small>${LAB.tag}</small></button>`;
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{
    if(c.classList.contains('locked'))return toast('خلّص اللي قبله أول 🔒','',1600);
    openLevel(c.dataset.i==='lab'?LAB:list[+c.dataset.i],false);
  });
}
$('#gBack').onclick=goHome;
$('#gLesson').onclick=showLesson;
$('#checkBtn').onclick=runCheck;
$('#gHint').onclick=()=>{
  const h=L.hint||'';
  modal(`<h3>💡 ${isLab()?'الحل':'تلميح'}</h3>${S.hint?'':'<p style="color:var(--muted);font-size:13.5px">(فتحه ينقص نجمة من التقييم)</p>'}${h.startsWith('<')?h:`<p>${esc(h)}</p>`}<div class="mbtns"><button class="pri" id="mOk">فهمت</button></div>`);
  S.hint=true;save();$('#mOk').onclick=closeModal;
};
$('#gReset').onclick=()=>{if(confirm('تبغى تمسح الشبكة وتبدأ من جديد؟'))openLevel(L,true)};
$('#resetAll').onclick=()=>{if(confirm('متأكد؟ بينمسح كل تقدّمك.')){P={stars:{},pct:{},cur:null,track:P.track};storeP();goHome()}};
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
goHome();
</script>
</body>
</html>
